name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    if: ${{ github.actor != 'dependabot[bot]' }}

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn --no-progress

      - name: Build
        run: yarn build:production
